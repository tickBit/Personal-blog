limit_req_zone $binary_remote_addr
    zone=reactions_per_ip:10m
    rate=10r/m;

server {
    listen 80;

    # /auth/login
    location = /auth/login {
        limit_req zone=login_per_ip burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
    }

    # refresh token
    location = /auth/refresh {
        limit_req zone=general_api_per_ip burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
    }

    # anonymous reactions
    location ~ ^/api/posts/[0-9]+/reactions$ {
        limit_req zone=reactions_per_ip burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
    }

    # other API requests
    location /api/ {
        limit_req zone=general_api_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
    }

    # unknown routes
    location / {
        limit_req zone=general_api_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
    }
}