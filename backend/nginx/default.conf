map $request_method $reaction_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}

limit_req_zone $reaction_limit_key
    zone=reactions_per_ip:10m
    rate=10r/m;

limit_req_zone $binary_remote_addr
    zone=login_per_ip:10m
    rate=5r/m;

limit_req_zone $binary_remote_addr
    zone=general_api_per_ip:10m
    rate=10r/s;

server {
    listen 80;

    client_max_body_size 1m;

    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;

        add_header Access-Control-Allow-Origin "http://localhost:8443" always;
        add_header Vary "Origin" always;
        add_header Retry-After "60" always;

        return 429 '{"error":"Too many requests"}';
    }
    
    location = /auth/login {
        limit_req zone=login_per_ip burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:8080;
    }

    location = /auth/refresh {
        limit_req zone=general_api_per_ip burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:8080;
    }

    location ~ ^/api/posts/[0-9]+/reactions$ {
        limit_req zone=reactions_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://host.docker.internal:8080;
    }

    location /api/ {
        limit_req zone=general_api_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:8080;
    }

    location / {
        limit_req zone=general_api_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:8080;
    }
}